[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whogetssummarized"
version = "0.1.0"
description = "Who Gets Summarized? Evidence-preserving evaluation and planning for product review summaries (Amazon Reviews 2023)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0",
  "pandas>=2.0",
  "pyarrow>=14",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "requests>=2.31",
  "tqdm>=4.66",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "transformers>=4.44", "sentencepiece", "protobuf"]
eda = ["matplotlib>=3.8", "psutil>=5.9"]
dev = ["pytest>=8"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
wgs = "wgs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wgs = ["prompts/*.txt", "release_files/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
